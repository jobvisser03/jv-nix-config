  wine: "#wijn"
  cheat-sheet: "#cheatsheet"
  life-goals: "#goals"
  effective-altriusm: "#effective-altruism"


# ─────────────────────────────────────────────────────────────────────────────
# 3. TASK MARKERS  (Logseq workflow -> Tasks plugin)
# ─────────────────────────────────────────────────────────────────────────────
task_only:            # applied only on "- [ ]" / "- [x]" lines
  a: "⏫"
  b: "🔼"
  c: "🔽"
everywhere:           # applied on all lines
  inbox: ""
  later: "#someday"
  someday: "#someday"
# Logseq date suffixes on tasks are converted by the script:
#   "— due [[2023-02-28|Journals/2023-02-28]]"       -> "📅 2023-02-28"
#   "— scheduled [[2023-08-31|Journals/2023-08-31]]" -> "⏳ 2023-08-31"

# ─────────────────────────────────────────────────────────────────────────────
# 4. DROP
# ─────────────────────────────────────────────────────────────────────────────
drop: [life, work, project, resource, misc, mensen]
links_replace:
  "quick capture": "#capture"      # 44x Logseq quick-capture marker
drop_properties:                   # Logseq SRS state lines (energy.md)
  - card-last-interval
  - card-repeats
  - card-ease-factor
  - card-next-schedule
  - card-last-reviewed
  - card-last-score
frontmatter_tags_drop: [Project, Area, Resource, Archive, home]
frontmatter_tags_to_type:
  cheatsheet: cheatsheet
  Cheatsheet: cheatsheet

# ─────────────────────────────────────────────────────────────────────────────
# 5. FILE MOVES  (source relative to vault root -> destination)
#    "TRASH" = move to .trash/   "MERGE:<dest>" = append content to dest
#    Root attachments (png/jpg/pdf/aac/...) -> Attachments/ automatically.
#    Journals with YYYY_MM_DD names -> YYYY-MM-DD automatically.
#    Any *conflicted* file -> "00 Inbox/_conflicts/" automatically.
#    Any .md not listed -> "00 Inbox/" (nothing gets lost).
# ─────────────────────────────────────────────────────────────────────────────
moves:
  # 00 Inbox
  Tasks/TODAY.md: 00 Inbox/TODAY.md
  Tasks/TODO.md: 00 Inbox/TODO.md
  Logseq/inbox.md: 00 Inbox/inbox.md
