# ─────────────────────────────────────────────────────────────────────────────
# 2. KEEP AS TAG  (classifiers; renames listed explicitly)
#    Pages that exist for these get a ```query``` block instead of backlinks
#    (see query_notes below).
# ─────────────────────────────────────────────────────────────────────────────
keep:
  # lists (to/* — all kept as-is)
  - to/*
  # note types
  - meeting
  - feedback
  - accomplishments
  - compliments
  - gratitude
  - book-summary
  - coaching-call
  - sales-interview
  - scrum-planning
  - verhaal
  - gedicht
  - quotes
  - idea
  - question
  - why
  - bespreken
  - capture
  # trackers / flashcards
  - bloeddruk
  - card
  # topic buckets without their own note
  - data-science
  - data-engineering
  - genai
  - nlp
  - rag
  - llmops
  - agents
  - computer-vision
  - deep-learning
  - tools
  - blog-posts-ai
  - this-week-in-ai
  - verhuur
  - vakantie
  - vakantie/*
  - tweede          # second child / pregnancy
  - derde

