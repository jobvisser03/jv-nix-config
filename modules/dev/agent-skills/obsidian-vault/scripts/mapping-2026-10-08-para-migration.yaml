# Vault migration mapping — review & edit, then the script (phase 3) consumes it.
#
# Tag keys are lowercase without '#'; matching is case-insensitive.
# Values are the LITERAL replacement text for the tag:
#   "[[Simon]]"                 -> tag becomes a link
#   "[[Enexis]] #enexis/squad"  -> link + keep a (sub)tag
#   "#wijn"                     -> rename tag
#   ""                          -> remove tag (surrounding text kept)
# Tags not listed anywhere are LEFT UNCHANGED (see "unmapped" in the report).
# Business: Dutch Dataworks = freelance company, Data Mastery = training company.
# Other organisations are leads / freelance projects -> 30 Resources/Organisations.

